# Anomaly thresholds applied to every report:
sanity:
  # Daily |Δ| above this gets flagged in the report (likely site error or notable event)
  flag_daily_pct_above: 3.0
  # Reject NAV history if latest data is older than this many calendar days
  max_staleness_days: 7
  # Cumulative-vs-sum rounding tolerance for cross-validation
  cross_validate_tolerance_pct: 0.0001
