[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funds-report"
version = "1.0.0"
description = "Twice-weekly NAV report for Russian mutual funds → xlsx → Telegram"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
funds-report = "funds_report.cli:main"

[tool.setuptools]
packages = ["funds_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
